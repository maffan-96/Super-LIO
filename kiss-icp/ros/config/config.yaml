# NOTE: Please note that this is just an example of the advanced configuration for the KISS-ICP
# pipeline and it's not really meant to use for any particular dataset, is just to expose other
# options that are disabled by default

kiss_icp_node:
  ros__parameters:
    ####    /!\ If you set these ROS-related parameters in the file, they will overwrite the corresponding launch arguments   ####

    # base_frame: ""
    # lidar_odom_frame: "odom_lidar"
    # publish_odom_tf: True
    # invert_odom_tf: True
    # position_covariance: 0.1
    # orientation_covariance: 0.1

    ####    Per-scan export (Super-LIO ros1 lidar-frame format)    ####
    # Saves every registered scan as <save_map_dir>/PCD/scans_<sec>_<nsec>.pcd
    # (points in the LiDAR sensor frame) and appends its T_world_lidar pose to
    # <save_map_dir>/slam_poses.csv (# counter, sec, nsec, x, y, z, qx, qy, qz, qw).
    # A relative save_map_dir resolves against the directory the node is launched from.
    export_lidar_frame: True
    save_map_dir: "kiss_icp_results"

    ####    Core KISS-ICP parameters    ####

    data:
      # Unity-simulated bags: clouds are rendered at a single instant and carry
      # no per-point time field, so there is nothing to deskew.
      deskew: False
      max_range: 100.0
      # Keep a small minimum range so missed Unity raycasts that land at the
      # sensor origin are dropped instead of fed to the registration.
      min_range: 0.3

    mapping:
      # voxel_size: 1.0 # <- optional, default = max_range / 100.0
      max_points_per_voxel: 20

    adaptive_threshold:
      initial_threshold: 2.0
      min_motion_th: 0.1

    registration:
      max_num_iterations: 500 # <- optional
      convergence_criterion: 0.0001 # <- optional
      max_num_threads: 0 # <- optional, 0 means automatic
